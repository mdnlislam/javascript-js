<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Media Example</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  
    <style>
   .formContainer{
   width:80%;
   height:70%;
   }

    </style>
  </head>

  <body>
<div class="formContainer">
<form class="myform">
<div class="formDetail">
<label for="name">Name:</label>
<input type="text" class="name" name="name">
<div class="errorMessage"></div>
</div>

<div class="formDetail">
<label for="email">Email:</label>
<input type="email" class="email" name="email">
<div class="errorMessage"></div>
</div>

<div class="formDetail">
<label for="password">Password:</label>
<input type="password" class="password" name="password">
<div class="errorMessage"></div>
</div>


<div class="formDetail">
<label for="password">Password:</label>
<input type="password" class="password" name="password">
<div class="errorMessage"></div>
</div>

<div class="formDetail">
<label for="confirmpassword">Confirmpassword:</label>
<input type="password" class="confirmpassword" name="confirmpassword">
<div class="errorMessage"></div>
</div>

<button class='button' type='submit'>Submit</button>

</form>  
</div>

<script>
const myform=document.querySelector('.myform');
myform.addEventListener('submit',(event)=>{
event.preventDefault();
});

const name=myform.elements.name.value.trim();
const nameError=document.querySelector('.name + .errorMessage');
const nameInput=document.querySelector('.name');
if(name==''){
nameError.textContent='Name is required.';
nameInput.parentNode.classList.add('error');
nameInput.parentNode.classList.remove('success');

}else{
nameError.textContent = '';
      nameInput.parentNode.classList.add('success');
      nameInput.parentNode.classList.remove('error');
}



</script>
	
	
	
  </body>

</html>
