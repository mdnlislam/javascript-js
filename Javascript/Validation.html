<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />

<body>
<h2>Email regex Validation</h2>
<form>
<input type='text' id='text' placeholder='Email'>
<button onclick='validate()' type='button'>Submit</button>


</form>


<script>
function validate(){
const mail=document.querySelector('#text').value;
const regex=/^([a-zA-Z0-9\._]+)@([a-zA-Z0-9])+.([a-z]+)(.[a-z]+)?$/
if(regex.test(mail)){
alert('you provided a valid Email Id')
 return true;
}
else{
alert('sorry ! 	Incorrect Email Id')
return false;
}
}

</script>
</body>

</html>
