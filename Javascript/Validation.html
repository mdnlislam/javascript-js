<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Media Example</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  
<style>
 

</style>
</head>

<body>
<h2>Email regex Validation</h2>
<form onsubmit='myfunction(event)'>
<input type='text' name='email' class='demo1' placeholder='Enter Email address'/> <br>
<p class='email'></p>
<input type='password' name='password' class='demo2' placeholder='Enter password'/><br>
<button type='submit'>submit</button>

</form>
<p class='message'></p>

<script>

function myfunction(event){
 event.preventDefault();
 
 const EmailInput=document.querySelector('.demo1').value;
const passwordInput=document.querySelector('.demo2').value;

 
const Regexemail=/^\w+@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$/;
const RegexPass=/^\d{4}/;

let email='';
 let valid='';
 
 

if(!EmailInput){

email='Plz. Enter Email!';
}
else if(Regexemail.test(EmailInput)){
email='Email Ok';
}
else{
email='worng Email!'
}
if(!passwordInput){
valid='plz.Enter a password';

}
else if(RegexPass.test(passwordInput)){
valid='Password OK';
}
else{
valid='plz.Enter a 4 digits password';
}

if(Regexemail.test(EmailInput)&& RegexPass.test(passwordInput)){
valid='Submit Ok';
}

const outputMessage=document.querySelector('.message');
outputMessage.innerHTML=valid;
const outputEmail=document.querySelector('.email');
outputEmail.innerHTML=email;

const Em=[outputEmail,outputMessage]
for(let eee of Em ){
if(eee.innerHTML==='Plz. Enter Email!'){
eee.style.color='black';
}
if(eee.innerHTML==='Email Ok'){
eee.style.color='green';
}
if(eee.innerHTML==='worng Email!'){
eee.style.color='red';
}


// password


if(eee.innerHTML==='plz.Enter a password'){
eee.style.color='black';
}
if(eee.innerHTML==='Password OK'){
eee.style.color='green';
}

if(eee.innerHTML==='plz.Enter a 4 digits password'){
eee.style.color='red';
}


console.log( eee);


}


return true;

}







</script>
</body>

</html>
